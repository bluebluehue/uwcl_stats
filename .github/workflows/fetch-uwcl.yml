name: Fetch UWCL Fantasy Data

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: fetch-uwcl-fantasy
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch and normalize UWCL data
        run: |
          python fetch_uwcl.py

      - name: Build UWCL decision data
        run: |
          python build_uwcl_transformed.py

      - name: Show generated data summary
        run: |
          python - <<'PY'
          import json

          with open("data/uwcl/meta.json", encoding="utf-8") as f:
              meta = json.load(f)

          with open("data/uwcl/transformed_data.json", encoding="utf-8") as f:
              transformed = json.load(f)

          print("Players:", meta.get("counts", {}).get("players"))
          print("Teams:", meta.get("counts", {}).get("teams"))
          print("Matches:", meta.get("counts", {}).get("matches"))
          print("Matchdays:", meta.get("counts", {}).get("matchdays"))
          print("Transformed players:", transformed.get("count"))
          print("Decision model:", transformed.get("model", {}).get("status"))
          print("GK role override file supported: data/uwcl/gk_roles.json")

          with open("data/uwcl/team_position_fixture_ratings.json", encoding="utf-8") as f:
              team_position = json.load(f)
          print("Team-position board teams:", len(team_position.get("teams", [])))

          nationality = meta.get("nationality_data", {})
          print(
              "Active nationality coverage:",
              nationality.get("active_matched_players"),
              "/",
              nationality.get("active_players")
          )

          print("Feed status:", meta.get("feed_status", {}))
          PY

      - name: Commit changed UWCL data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/uwcl

          if git diff --cached --quiet; then
            echo "No UWCL data changes to commit."
            exit 0
          fi

          git commit -m "Update UWCL fantasy data"
          git push

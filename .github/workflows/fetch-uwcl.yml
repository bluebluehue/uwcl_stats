name: Fetch UWCL Fantasy Data

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: fetch-uwcl-fantasy
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch and normalize UWCL data
        run: |
          python fetch_uwcl.py

      - name: Show generated files
        run: |
          find data/uwcl -maxdepth 4 -type f -print
          echo
          echo "Meta:"
          cat data/uwcl/meta.json
          echo
          echo "Nationality summary:"
          python - <<'PY'
          import json

          with open(
              "data/uwcl/nationalities.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print(
              "Matched:",
              data["matched_players"],
              "/",
              data["fantasy_players"]
          )
          print(
              "Unmatched:",
              data["unmatched_players"]
          )
          print(
              "Nationalities:",
              data["nationality_count"]
          )
          PY

      - name: Commit changed UWCL data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/uwcl

          if git diff --cached --quiet; then
            echo "No UWCL data changes to commit."
            exit 0
          fi

          git commit -m "Update UWCL fantasy data"
          git push

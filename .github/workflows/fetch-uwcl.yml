name: Fetch UWCL Fantasy Data

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: fetch-uwcl-fantasy
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch and normalize UWCL data
        run: |
          python fetch_uwcl.py

      - name: Show generated data summary
        run: |
          echo "UWCL data files:"
          find data/uwcl -maxdepth 4 -type f -print

          echo
          echo "UWCL data summary:"

          python - <<'PY'
          import json

          with open(
              "data/uwcl/meta.json",
              encoding="utf-8"
          ) as f:
              meta = json.load(f)

          counts = meta.get("counts", {})
          nationality = meta.get("nationality_data", {})
          feed_status = meta.get("feed_status", {})

          print(
              "Players:",
              counts.get("players", "?")
          )
          print(
              "Teams:",
              counts.get("teams", "?")
          )
          print(
              "Matches:",
              counts.get("matches", "?")
          )
          print(
              "Matchdays:",
              counts.get("matchdays", "?")
          )

          print()
          print("Nationality coverage:")
          print(
              "All players:",
              nationality.get("matched_players", "?"),
              "/",
              counts.get("players", "?")
          )
          print(
              "Active players:",
              nationality.get(
                  "active_matched_players",
                  "?"
              ),
              "/",
              nationality.get(
                  "active_players",
                  "?"
              )
          )
          print(
              "Active unmatched:",
              nationality.get(
                  "active_unmatched_players",
                  "?"
              )
          )

          print()
          print("Feed status:")
          for feed in (
              "players",
              "teams",
              "fixtures",
          ):
              print(
                  f"{feed}:",
                  feed_status.get(
                      feed,
                      "unknown"
                  )
              )

          print()
          print(
              "Fetched at:",
              meta.get(
                  "fetched_at_utc",
                  "unknown"
              )
          )
          PY

      - name: Commit changed UWCL data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/uwcl

          if git diff --cached --quiet; then
            echo "No UWCL data changes to commit."
            exit 0
          fi

          git commit -m "Update UWCL fantasy data"
          git push

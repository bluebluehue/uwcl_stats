name: Fetch UWCL Nationalities

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-nationalities:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch UEFA squad nationalities
        run: |
          python fetch_uwcl_nationalities.py

      - name: Show nationality summary
        run: |
          python - <<'PY'
          import json

          with open(
              "data/uwcl/nationalities_master.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print("Players:", data["player_count"])
          print(
              "Nationalities:",
              data["nationality_count"]
          )
          print(
              "Successful teams:",
              data["successful_team_count"],
              "/",
              data["team_count"]
          )
          print(
              "Failed teams:",
              data["failed_teams"]
          )
          PY

      - name: Commit nationality data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/uwcl

          if git diff --cached --quiet; then
            echo "No nationality changes to commit."
            exit 0
          fi

          git commit -m "Add UWCL nationality data"
          git push

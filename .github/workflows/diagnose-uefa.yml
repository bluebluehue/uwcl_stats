name: Diagnose UEFA connectivity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Test DNS, TLS and UEFA endpoints (no data changes)
        shell: bash
        run: |
          python3 - <<'PY'
          import socket, ssl, urllib.request, urllib.error, subprocess, time
          from urllib.parse import urlparse

          host = 'gaming.uefa.com'

          endpoints = {
              'UEFA fixtures': 'https://gaming.uefa.com/en/uwclfantasy/services/feeds/fixtures/fixtures_40_en.json',
              'UEFA MD3 players': 'https://gaming.uefa.com/en/uwclfantasy/services/feeds/players/players_40_en_3.json',
              'Control GitHub': 'https://api.github.com',
          }

          print('DNS:', flush=True)
          try:
              addresses = sorted({
                  x[4][0] for x in socket.getaddrinfo(
                      host, 443, type=socket.SOCK_STREAM
                  )
              })
              print('  resolved addresses:', addresses, flush=True)
          except Exception as e:
              print('  ERROR:', repr(e), flush=True)

          print('TLS connectivity:', flush=True)
          try:
              with socket.create_connection((host, 443), timeout=6) as sock:
                  with ssl.create_default_context().wrap_socket(
                      sock, server_hostname=host
                  ) as tls:
                      print('  OK, TLS version:', tls.version(), flush=True)
          except Exception as e:
              print('  ERROR:', repr(e), flush=True)

          for label, url in endpoints.items():
              for method in (
                  'python-default',
                  'python-browser-headers',
                  'curl-http1.1'
              ):
                  print(f'\n{label} / {method}:', flush=True)
                  t = time.monotonic()

                  try:
                      if method.startswith('python'):
                          headers = (
                              {'User-Agent': 'UWCL-Diagnostic/1.0'}
                              if method == 'python-default'
                              else {
                                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/125.0 Safari/537.36',
                                  'Accept': 'application/json,text/plain,*/*',
                                  'Accept-Language': 'en-US,en;q=0.9',
                              }
                          )

                          req = urllib.request.Request(
                              url, headers=headers
                          )

                          with urllib.request.urlopen(
                              req, timeout=8
                          ) as response:
                              sample = response.read(256)
                              print(
                                  '  HTTP', response.status,
                                  'content-type',
                                  response.headers.get('Content-Type'),
                                  'sample-bytes', len(sample),
                                  flush=True
                              )

                      else:
                          result = subprocess.run(
                              [
                                  'curl', '-4', '--http1.1',
                                  '-L', '-sS',
                                  '-o', '/dev/null',
                                  '--max-time', '8',
                                  '-w',
                                  'HTTP %{http_code}; remote_ip %{remote_ip}; connect %{time_connect}s; TLS %{time_appconnect}s; first_byte %{time_starttransfer}s',
                                  url
                              ],
                              capture_output=True,
                              text=True,
                              timeout=11
                          )

                          print(
                              '  exit', result.returncode,
                              result.stdout.strip(),
                              result.stderr.strip()[:300],
                              flush=True
                          )

                  except Exception as e:
                      print(
                          '  ERROR:',
                          type(e).__name__,
                          str(e)[:350],
                          flush=True
                      )

                  print(
                      '  elapsed',
                      round(time.monotonic() - t, 2),
                      's',
                      flush=True
                  )
          PY

      - name: Diagnostic complete
        run: echo 'Diagnostics only; no repository files were changed.'
